# Dracula — Dark & Light Theme
name = "Dracula"
description = "Dracula theme — a dark purple aesthetic inspired by the popular Dracula color scheme"

# ── Dark Variant ───────────────────────────────────────────
[dark]
primary = "#bd93f9"
secondary = "#6272a4"
accent = "#ffb86c"
success = "#50fa7b"
warning = "#f1fa8c"
error = "#ff5555"
info = "#8be9fd"
muted = "#44475a"
hintKey = "#6272a4"
background = "#282a36"
foreground = "#f8f8f2"
border = "#6272a4"
surface = "#383a59"

[dark.highlights]
menuTitle = "#bd93f9"
# 菜单项文字颜色
menuItem = "#f8f8f2"
# 选中项前景色
selectedItem = "#bd93f9"
# 选中项背景色
selectedItemBg = "#383a59"
# 鼠标悬停颜色
menuItemHover = "#ffb86c"
# 选中+悬停颜色
selectedItemHover = "#bd93f9"
# 页面标题颜色
title = "#bd93f9"
# 输入提示颜色
prompt = "#bd93f9"
# 返回按钮颜色
backButton = "#6272a4"
# 返回按钮悬停颜色
backButtonHover = "#ffb86c"
# 副标题颜色
subtitle = "#6272a4"
# 进度条空槽颜色
progressEmpty = "#44475a"
# 滚动条轨道颜色
scrollTrack = "#383a59"
# 滚动条滑块颜色
scrollThumb = "#44475a"
# 按钮常态颜色
button = "#bd93f9"
# 按钮失焦颜色
buttonBlurred = "#6272a4"

[dark.popup]
surface = "#383a59"
border = "#6272a4"

# ── 通知组件配色 ─────────────────────────────────────────
[dark.notification]
surface = "#383a59"
# 信息通知边框色
infoBorder = "#8be9fd"
# 成功通知边框色
successBorder = "#50fa7b"
# 警告通知边框色
warningBorder = "#f1fa8c"
# 错误通知边框色
errorBorder = "#ff5555"

# ── 状态栏配色 ───────────────────────────────────────────
[dark.statusBar]
# 状态栏基底背景色
bar = "#383a59"
# 状态栏文字颜色
text = "#6272a4"
# 面包屑路径颜色
breadcrumb = "#44475a"
# 面包屑分隔符颜色 ">"
breadcrumbSep = "#44475a"
# 面包屑悬停颜色
breadcrumbHover = "#ffb86c"
# 面包屑点击颜色
breadcrumbClick = "#bd93f9"
# 时间显示颜色
time = "#44475a"
# 标签块文字颜色
nugget = "#f8f8f2"
# 标签块背景色
nuggetLabel = "#bd93f9"

# ── Markdown 渲染主题 ────────────────────────────────────
# 支持 glamour 内置主题名（dark/light/dracula/tokyo-night/notion/pink）
# 或自定义 JSON 主题文件路径
[dark.markdown]
dark = "dracula"
light = "light"

[dark.app]
# Lyric colors
lyricActive = "#8be9fd"
lyricTransition = "#bd93f9"
lyricInactive = "#44475a"
lyricHighlight = "#f8f8f2"

# Playbar colors (ANSI terminal colors — adapt to terminal theme)
playbarMode = "#bd93f9"
playbarVolume = "#8be9fd"
playbarPlaying = "#50fa7b"
playbarPaused = "#f1fa8c"
playbarHeartLiked = "#ff5555"
playbarHeartUnliked = "#6272a4"
playbarArtist = "#6272a4"

# Visualizer colors: "random" or hex
visualizerColorStart = "random"
visualizerColorEnd = "random"

# 整个应用背景色（默认透明不设置）
background = "#282a36"
# 右键菜单背景色
contextMenuBg = "#383a59"
# 右键菜单边框色
contextMenuBorder = "#6272a4"
# 频谱纵向渐变色
spectrumVerticalBg = "#282a36"
# 桌面歌词背景色
desktopLyricsBg = "#282a36"
# 登录/认证状态颜色
loginError = "#ff5555"
loginSuccess = "#50fa7b"
authStatus = "#8be9fd"
# CLI 配置表颜色
configTableBorder = "#44475a"
configTableSelectedFg = "#f8f8f2"
configTableSelectedBg = "#383a59"

# ── Light Variant ──────────────────────────────────────────
