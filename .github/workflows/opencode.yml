name: opencode

on:
  workflow_call:
    inputs:
      model:
        description: Model to use for opencode
        type: string
        required: false
        default: minimax-cn/MiniMax-M2.7
      agent:
        description: Agent to use (optional; falls back to the action default)
        type: string
        required: false
        default: ''
      prompt:
        description: Custom prompt to pass to opencode (optional)
        type: string
        required: false
        default: ''
      open_code_permission:
        description: JSON permission override for opencode (optional; called workflows get no override by default)
        type: string
        required: false
        default: ''
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_call' ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_PERMISSION: "${{ (github.event_name == 'workflow_call' && inputs.open_code_permission) || (github.event_name != 'workflow_call' && '{\"bash\": \"deny\"}') }}"
        with:
          # model: zhipuai-coding-plan/glm-4.7
          model: "${{ (github.event_name == 'workflow_call' && inputs.model) || 'deepseek/deepseek-v4-flash' }}"
          agent: "${{ (github.event_name == 'workflow_call' && inputs.agent) || '' }}"
          prompt: "${{ (github.event_name == 'workflow_call' && inputs.prompt) || '' }}"
