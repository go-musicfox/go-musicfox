name: triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    uses: ./.github/workflows/opencode.yml
    with:
      agent: triage
      prompt: |
        以下 Issue 刚刚创建，请进行分诊：

        标题：${{ github.event.issue.title }}

        ${{ github.event.issue.body }}
    secrets: inherit
